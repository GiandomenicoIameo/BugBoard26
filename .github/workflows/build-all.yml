name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # La release viene pubblicata automaticamente solo quando invii un tag (es. v1.0.0)
  workflow_dispatch:

run-name: Release Bugboard

jobs:
  # ==========================================
  # JOB 1: LINUX (.deb)
  # ==========================================
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install packaging tools (dpkg, fakeroot)
        timeout-minutes: 5
        run: |
          if command -v fakeroot >/dev/null && command -v dpkg-deb >/dev/null; then
            echo "fakeroot e dpkg già presenti"
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Acquire::Retries=3 install -y fakeroot dpkg
          fi

      - name: Download JavaFX JMods
        run: |
          curl -sL https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_linux-x64_bin-jmods.zip -o javafx-jmods.zip
          unzip -q javafx-jmods.zip

      - name: Build Fat JAR with Maven
        run: ./front-end/mvnw -f front-end/pom.xml clean package

      - name: Generate Custom Runtime with jlink
        run: |
          jlink \
            --module-path $JAVA_HOME/jmods:./javafx-jmods-21.0.2 \
            --add-modules java.base,java.net.http,javafx.controls,javafx.fxml \
            --output front-end/target/image

      - name: Prepare jpackage input
        run: |
          mkdir -p front-end/target/input
          cp front-end/target/demo-1.0-SNAPSHOT.jar front-end/target/input/

      - name: Create .deb Package with jpackage
        run: |
          jpackage \
            --type deb \
            --name bugboard \
            --app-version 1.0.0 \
            --dest front-end/target/dist \
            --runtime-image front-end/target/image \
            --input front-end/target/input \
            --main-jar demo-1.0-SNAPSHOT.jar \
            --main-class org.example.demo.view.access.Main \
            --linux-shortcut \
            --linux-menu-group "Utility"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: bugboard-deb-linux
          path: front-end/target/dist/*.deb
          compression-level: 0

  # ==========================================
  # JOB 2: WINDOWS (App Image in ZIP)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download JavaFX JMods for Windows
        run: |
          curl.exe -sL "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-jmods.zip" -o javafx-jmods.zip
          Expand-Archive -Path javafx-jmods.zip -DestinationPath .

      - name: Build Fat JAR with Maven
        run: ./front-end/mvnw.cmd -f front-end/pom.xml clean package -DskipTests

      - name: Generate Custom Runtime with jlink
        run: jlink --module-path "$env:JAVA_HOME/jmods;./javafx-jmods-21.0.2" --add-modules java.base,java.net.http,javafx.controls,javafx.fxml --output front-end/target/image

      - name: Prepare jpackage input
        run: |
          New-Item -ItemType Directory -Force front-end/target/input | Out-Null
          Copy-Item front-end/target/demo-1.0-SNAPSHOT.jar front-end/target/input/

      - name: Create Windows package with jpackage
        run: jpackage --type app-image --name bugboard --app-version 1.0.0 --dest front-end/target/dist --runtime-image front-end/target/image --input front-end/target/input --main-jar demo-1.0-SNAPSHOT.jar --main-class org.example.demo.view.access.Main --verbose

      - name: Compress Windows directory to Zip cleanly
        run: |
          # Comprimiamo direttamente il contenuto della cartella dell'applicazione in un unico file zip con la cartella radice desiderata
          Compress-Archive -Path front-end/target/dist/bugboard\* -DestinationPath front-end/target/dist/bugboard-windows-1.0.0-amd64.zip

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: bugboard-windows-zip
          path: front-end/target/dist/*.zip
          compression-level: 0

  # ==========================================
  # JOB 3: RELEASE (Pubblica automaticamente)
  # ==========================================
  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files to publish
        run: ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: "Bugboard ${{ github.ref_name }}"
          body: "Rilascio automatico dei pacchetti compilati per Linux (.deb) e Windows (ZIP)."
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
